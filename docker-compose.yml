version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ee_cctv_ai_backend
    ports:
      - "0.0.0.0:3030:5000"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5000
      - HOST=0.0.0.0
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend/ai-suspected-monitoring-app
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://10.153.91.18:3030/api
        - VITE_API_TIMEOUT=30000
        - VITE_AUTH_ENABLED=true
        - VITE_POLLING_INTERVAL=5000
        - VITE_MAX_RETRY_ATTEMPTS=3
        - VITE_APP_TITLE=AI Suspected Monitoring App
        - VITE_THEME=light
        - VITE_DEBUG=false
    container_name: ee_cctv_ai_frontend
    ports:
      - "0.0.0.0:8080:80"

    restart: unless-stopped
    depends_on:
      - backend